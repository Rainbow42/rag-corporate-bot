services:
  indexer:
    build: .
    command: ["python", "build_index.py"]
    volumes:
      - rag-index:/app/data/index
      - rag-logs:/app/logs

  rag-api:
    build: .
    depends_on:
      indexer:
        condition: service_completed_successfully
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - rag-index:/app/data/index
      - rag-logs:/app/logs

  telegram:
    build: .
    command: ["python", "telegram_bot.py"]
    depends_on:
      indexer:
        condition: service_completed_successfully
    env_file: .env
    profiles: ["telegram"]
    volumes:
      - rag-index:/app/data/index
      - rag-logs:/app/logs

  scheduler:
    build: .
    command: ["cron", "-f"]
    depends_on:
      indexer:
        condition: service_completed_successfully
    volumes:
      - rag-index:/app/data/index
      - rag-logs:/app/logs
      - ./knowledge_base:/app/knowledge_base:ro

volumes:
  rag-index:
  rag-logs:
